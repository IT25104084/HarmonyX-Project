<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Review Song')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="page-head">
        <h1>Review Song</h1>
        <a th:href="@{/admin/music}" class="btn secondary">← Back to Queue</a>
    </div>

    <div class="grid-2" style="align-items:start;">

        <!-- Song details -->
        <div>
            <div class="card">
                <h3 th:text="${song.title}">Song Title</h3>
                <p><strong>Artist:</strong> <span th:text="${song.artist.stageName}">Artist</span>
                    <span th:if="${song.artist.verificationStatus.name() == 'VERIFIED'}"
                          class="badge VERIFIED" style="margin-left:6px;">✓ Verified</span>
                </p>
                <p><strong>Genre:</strong> <span th:text="${song.genre ?: '—'}">Genre</span></p>
                <p><strong>Mood:</strong> <span th:text="${song.mood ?: '—'}">Mood</span></p>
                <p><strong>Language:</strong> <span th:text="${song.language ?: '—'}">Language</span></p>
                <p><strong>Album:</strong> <span th:text="${song.album != null ? song.album.title : 'Single'}">Album</span></p>
                <p><strong>Submitted:</strong> <span th:text="${#temporals.format(song.createdAt,'dd MMM yyyy HH:mm')}">Date</span></p>

                <th:block th:if="${song.artworkUrl != null}">
                    <p><strong>Artwork:</strong></p>
                    <img th:src="${song.artworkUrl}" alt="Artwork"
                         style="max-width:200px;border-radius:6px;border:1px solid var(--border);">
                </th:block>

                <th:block th:if="${song.audioFileUrl != null}">
                    <p style="margin-top:14px;"><strong>Audio Preview:</strong></p>
                    <audio controls style="width:100%;margin-top:6px;">
                        <source th:src="${song.audioFileUrl}">
                        Your browser does not support the audio element.
                    </audio>
                </th:block>
            </div>

            <th:block th:if="${song.description != null and !song.description.isEmpty()}">
                <div class="card">
                    <h3>Description</h3>
                    <p th:text="${song.description}">Description</p>
                </div>
            </th:block>

            <th:block th:if="${song.lyrics != null and !song.lyrics.isEmpty()}">
                <div class="card">
                    <h3>Lyrics</h3>
                    <pre style="white-space:pre-wrap;font-family:inherit;margin:0;" th:text="${song.lyrics}">Lyrics</pre>
                </div>
            </th:block>
        </div>

        <!-- Review form -->
        <div>
            <div class="card">
                <h3>Review Decision</h3>
                <form th:action="@{/admin/music/{id}/review(id=${song.id})}" th:object="${reviewForm}" method="post">
                    <div class="form-row">
                        <label for="decision">Decision *</label>
                        <select id="decision" th:field="*{decision}" required>
                            <option value="">— Select Decision —</option>
                            <option value="APPROVED">✓ Approve — Publish to platform</option>
                            <option value="CHANGES_REQUIRED">✏ Request Changes — Return to artist</option>
                            <option value="REJECTED">✗ Reject — Deny publication</option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('decision')}" th:errors="*{decision}"></div>
                    </div>
                    <div class="form-row">
                        <label for="reviewNote">Review Note (optional)</label>
                        <textarea id="reviewNote" th:field="*{reviewNote}"
                                  placeholder="Explain your decision to the artist..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button class="btn" type="submit">Submit Review</button>
                        <a th:href="@{/admin/music}" class="btn secondary">Cancel</a>
                    </div>
                </form>
            </div>

            <!-- Prior review note (if any) -->
            <div class="card" th:if="${song.reviewNote != null and !song.reviewNote.isEmpty()}">
                <h3>Previous Review Note</h3>
                <p th:text="${song.reviewNote}" class="muted">Note</p>
                <p class="small muted" th:if="${song.reviewedBy != null}">
                    Reviewed by: <strong th:text="${song.reviewedBy.fullName}">Admin</strong>
                    <span th:if="${song.reviewedAt != null}"
                          th:text="' on ' + ${#temporals.format(song.reviewedAt,'dd MMM yyyy')}"></span>
                </p>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
